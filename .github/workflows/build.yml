name: Native build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  JUCE_COMMIT: ea77444750de45e036e0279bb0291144bf8e3688 # JUCE 8.0.16, as in CMakeLists.txt
  # The developer package (1.0.0): its zip and the folder inside share the name (artifact LIGHT SEEKER-dev-macOS).
  PACKAGE: WindwardAudio-LightSeeker-1.0.0-macOS-Universal
jobs:
  macos:
    runs-on: macos-15
    # 2026-11-12: 120 (was 90): Developer ID signing and two notarisations join the job.
    timeout-minutes: 120
    outputs:
      customer: ${{ steps.customer.outputs.name }}
    env:
      APPLE_TEAM_ID: YYZP4W7G7D # LJP Records Inc. (Windward Audio); not a secret
      # With the Samples token the captured spaces and the recordings must be there (the
      # smoke test checks); without it the build falls back to the stand-ins.
      LS_REQUIRE_CAPTURES: ${{ secrets.SAMPLES_TOKEN != '' }}
      LS_REQUIRE_SAMPLES: ${{ secrets.SAMPLES_TOKEN != '' }}
      # The library brass and woodwinds come from a public source: every CI build must have them.
      LS_REQUIRE_LIBRARY: "true"
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_SLOPPINESS: time_macros,include_file_mtime,include_file_ctime
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain and Rosetta
        run: |
          sw_vers
          xcodebuild -version
          cmake --version
          /usr/sbin/softwareupdate --install-rosetta --agree-to-license || true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The developer's recordings live in the private AdrianAbbas/Samples repository,
      # read with the SAMPLES_TOKEN secret and prepared for the instrument's sampler here
      # (tools/sample-prep, from WORLDBUILDER). They are never committed to this repository.
      # Without the secret the build goes on and those instruments play their stand-ins.
      # The captured spaces' impulse responses are made from the same repository's effect
      # captures (tools/captures/ci-build-irs.sh) and compiled in; without them, fallbacks.
      - name: Fetch and prepare the recordings (private repository, optional)
        env:
          SAMPLES_TOKEN: ${{ secrets.SAMPLES_TOKEN }}
        run: bash scripts/ci-fetch-samples.sh "${{ runner.temp }}/samples-src" "${{ runner.temp }}/samples" "${{ runner.temp }}/irs"
      # Real brass and woodwinds: the horn, trumpet, trombone and tuba, the flute, oboe, piccolo,
      # clarinet and bassoon of VSCO 2 Community Edition (CC0 1.0,
      # docs/LICENSES/VSCO-2-CE.txt), fetched from its official repository at a pinned commit
      # (licence checked), prepared (tools/sample-prep/vsco.py) and added to the recordings
      # above; never committed here. The prepared notes are cached; without them, stand-ins.
      - name: Library brass and woodwinds cache (VSCO 2 CE, prepared)
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vsco-cache
          key: vsco2ce-28092772-${{ hashFiles('tools/sample-prep/vsco.py', 'tools/sample-prep/prepare.py') }}
      - name: Fetch and prepare the library brass and woodwinds (VSCO 2 CE from its official source)
        run: bash scripts/ci-fetch-vsco.sh "${{ runner.temp }}/vsco-cache" "${{ runner.temp }}/samples"
      # JUCE is fetched once and kept (the configure step otherwise clones its whole history).
      - name: JUCE source cache
        id: juce
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/juce
          key: juce-${{ env.JUCE_COMMIT }}
      - name: Fetch JUCE 8.0.16
        if: steps.juce.outputs.cache-hit != 'true'
        run: bash scripts/ci-fetch-juce.sh "${{ runner.temp }}/juce" "$JUCE_COMMIT"
      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: macos-universal
          max-size: 2G
      - name: Configure (universal arm64 + x86_64, macOS 10.15+)
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15
          -DJUCE_PATH="${{ runner.temp }}/juce" -DLS_SAMPLES_DIR="${{ runner.temp }}/samples" -DLS_IRS_DIR="${{ runner.temp }}/irs"
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build (LIGHT SEEKER and LIGHT SEEKER FX)
        run: |
          cmake --build build --parallel 4
          ccache --show-stats
      # The full processor suite runs in the Linux job. Here a short smoke group checks
      # each slice of the universal binary, and the cpu group reports (never fails on)
      # the cost of every location on this runner.
      - name: Smoke test, instrument and release checks and CPU report (arm64)
        env:
          LIGHTSEEKER_SAMPLES: ${{ runner.temp }}/samples
        run: /usr/bin/arch -arm64 build/LightSeekerTests_artefacts/Release/LightSeekerTests --only smoke,instrument,release,cpu
      - name: Smoke test, instrument and release checks and CPU report (x86_64 under Rosetta)
        env:
          LIGHTSEEKER_SAMPLES: ${{ runner.temp }}/samples
        run: /usr/bin/arch -x86_64 build/LightSeekerTests_artefacts/Release/LightSeekerTests --only smoke,instrument,release,cpu
      - name: Universal binary and Info.plist gate (both plug-ins)
        run: bash scripts/ci-check-bundles.sh build
      # Developer ID signing and notarisation (docs/RELEASING.md): only for pushes to main and manual
      # runs, never for pull requests or forks, and only when all seven secrets exist. Otherwise the
      # build is signed ad hoc as before (scripts/package-mac.sh) and LIGHT SEEKER.pkg is built unsigned
      # for the install test only. Secrets reach only the steps that need them and are never printed.
      - name: Decide whether this run signs with Developer ID
        id: signing
        env:
          ELIGIBLE: ${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && !github.event.repository.fork }}
          HAVE_MACOS_APP_CERT_P12: ${{ secrets.MACOS_APP_CERT_P12 != '' }}
          HAVE_MACOS_APP_CERT_PASSWORD: ${{ secrets.MACOS_APP_CERT_PASSWORD != '' }}
          HAVE_MACOS_INSTALLER_CERT_P12: ${{ secrets.MACOS_INSTALLER_CERT_P12 != '' }}
          HAVE_MACOS_INSTALLER_CERT_PASSWORD: ${{ secrets.MACOS_INSTALLER_CERT_PASSWORD != '' }}
          HAVE_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID != '' }}
          HAVE_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID != '' }}
          HAVE_ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 != '' }}
        run: |
          missing=""
          for name in MACOS_APP_CERT_P12 MACOS_APP_CERT_PASSWORD MACOS_INSTALLER_CERT_P12 MACOS_INSTALLER_CERT_PASSWORD ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            have="HAVE_$name"
            [[ "${!have}" == true ]] || missing="$missing $name"
          done
          if [[ "$ELIGIBLE" != true ]]; then
            echo "::notice title=Ad-hoc build::Developer ID signing and notarisation run only for pushes to main and manual runs ($GITHUB_EVENT_NAME on $GITHUB_REF): this build is signed ad hoc and LIGHT SEEKER.pkg is unsigned (install test only)."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          elif [[ -n "$missing" ]]; then
            echo "::notice title=Ad-hoc build::Developer ID signing skipped, these secrets are missing:$missing. This build is signed ad hoc and LIGHT SEEKER.pkg is unsigned (install test only). See docs/RELEASING.md."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "Developer ID signing and notarisation enabled (team $APPLE_TEAM_ID)."
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Import the Developer ID certificates and the G2 intermediate into a temporary keychain
        if: steps.signing.outputs.enabled == 'true'
        env:
          MACOS_APP_CERT_P12: ${{ secrets.MACOS_APP_CERT_P12 }}
          MACOS_APP_CERT_PASSWORD: ${{ secrets.MACOS_APP_CERT_PASSWORD }}
          MACOS_INSTALLER_CERT_P12: ${{ secrets.MACOS_INSTALLER_CERT_P12 }}
          MACOS_INSTALLER_CERT_PASSWORD: ${{ secrets.MACOS_INSTALLER_CERT_PASSWORD }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: bash scripts/ci-signing-setup.sh
      - name: Sign both plug-ins with Developer ID (hardened runtime, secure timestamp, no entitlements)
        if: steps.signing.outputs.enabled == 'true'
        run: >
          bash scripts/sign-mac.sh
          build/LightSeeker_artefacts/Release/AU/LightSeeker.component build/LightSeeker_artefacts/Release/VST3/LightSeeker.vst3 build/LightSeekerFX_artefacts/Release/AU/LightSeekerFX.component build/LightSeekerFX_artefacts/Release/VST3/LightSeekerFX.vst3
      # Bundles already signed with Developer ID keep their signature; everything else is signed ad hoc.
      - name: Sign, verify and package (both plug-ins)
        run: bash scripts/package-mac.sh build dist "$PACKAGE"
      - name: Notarise the zip, staple the tickets to the four bundles and re-package
        if: steps.signing.outputs.enabled == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          bash scripts/notarize-mac.sh "dist/$PACKAGE.zip" build/ci-logs/notary
          for bundle in build/LightSeeker_artefacts/Release/AU/LightSeeker.component build/LightSeeker_artefacts/Release/VST3/LightSeeker.vst3 build/LightSeekerFX_artefacts/Release/AU/LightSeekerFX.component build/LightSeekerFX_artefacts/Release/VST3/LightSeekerFX.vst3; do
            stapled=0
            for attempt in 1 2 3 4; do
              if xcrun stapler staple "$bundle"; then stapled=1; break; fi
              sleep $((attempt * 15))
            done
            [[ $stapled == 1 ]] || echo "::warning::could not staple a ticket to $bundle (Gatekeeper still finds the ticket online)"
          done
          bash scripts/package-mac.sh build dist "$PACKAGE"
      - name: Build the installer package LIGHT SEEKER.pkg (productbuild, Developer ID Installer when signing)
        run: bash scripts/build-pkg.sh build "dist/LIGHT SEEKER.pkg"
      - name: Notarise LIGHT SEEKER.pkg and staple the ticket
        if: steps.signing.outputs.enabled == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: bash scripts/notarize-mac.sh --staple "dist/LIGHT SEEKER.pkg" build/ci-logs/notary
      - name: Verify signatures, notarisation and Gatekeeper (four bundles and the installer)
        if: steps.signing.outputs.enabled == 'true'
        run: >
          bash scripts/ci-verify-signing.sh "dist/LIGHT SEEKER.pkg"
          build/LightSeeker_artefacts/Release/AU/LightSeeker.component build/LightSeeker_artefacts/Release/VST3/LightSeeker.vst3 build/LightSeekerFX_artefacts/Release/AU/LightSeekerFX.component build/LightSeekerFX_artefacts/Release/VST3/LightSeekerFX.vst3
      - name: Build AU host harness
        run: bash scripts/build-au-harness.sh build/LightSeekerAUHarness
      - name: Install a quarantined download over a pre-1.0 install, then registry, auval, harness and old sessions for both plug-ins (arm64 + x86_64)
        run: bash scripts/ci-user-install-test.sh "dist/$PACKAGE.zip" build/LightSeekerAUHarness build/ci-logs
      - name: Install LIGHT SEEKER.pkg on the runner, then auval and the harness on the installed copies (arm64 + x86_64)
        run: bash scripts/ci-pkg-install-test.sh ${{ steps.signing.outputs.enabled == 'true' && '--notarized' || '' }} "dist/LIGHT SEEKER.pkg" build/LightSeekerAUHarness build/ci-logs/pkg
      # Annotations are readable through the REST API; GitHub keeps at most 10 per step.
      - name: Publish install and arm64 harness logs as annotations
        if: always()
        run: bash scripts/ci-annotate.sh --condense build/ci-logs/quarantine.txt build/ci-logs/install-mac.txt build/ci-logs/registry.txt build/ci-logs/migration.txt build/ci-logs/harness-arm64-*.txt
      - name: Publish x86_64 harness and auval logs as annotations
        if: always()
        run: |
          for f in build/ci-logs/auval-*.txt; do
            if [[ -f "$f" ]]; then tail -25 "$f" > "$f.tail"; fi
          done
          bash scripts/ci-annotate.sh --condense build/ci-logs/harness-x86_64-*.txt build/ci-logs/control-*.txt build/ci-logs/crashes.txt build/ci-logs/auval-*.txt.tail
      - name: Upload the developer package (bundles and install scripts, for testing only; only when every check passed)
        uses: actions/upload-artifact@v4
        with:
          name: LIGHT SEEKER-dev-macOS
          path: dist/${{ env.PACKAGE }}.zip
          if-no-files-found: error
      - name: Publish LIGHT SEEKER.pkg install logs as annotations
        if: always()
        run: |
          for f in build/ci-logs/pkg/pkg-auval-*.txt; do
            if [[ -f "$f" ]]; then tail -12 "$f" > "$f.tail"; fi
          done
          bash scripts/ci-annotate.sh --condense build/ci-logs/pkg/pkg-gatekeeper.txt build/ci-logs/pkg/pkg-scripts.txt build/ci-logs/pkg/pkg-registry.txt build/ci-logs/pkg/pkg-crashes.txt build/ci-logs/pkg/pkg-auval-*.txt.tail
      # Customer download (docs/INSTALLER_STANDARD.md): LIGHT SEEKER-<version>-macOS with only the signed,
      # notarised "LIGHT SEEKER Installer.pkg" and "LIGHT SEEKER - Read Me.pdf". Ad-hoc runs produce none.
      - name: Stage the customer package (LIGHT SEEKER Installer.pkg and the Read Me)
        id: customer
        run: |
          name="LIGHT SEEKER-$(python3 -c 'import json; print(json.load(open("installer/product.json"))["version"])')-macOS"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          if [[ "${{ steps.signing.outputs.enabled }}" == true ]]; then
            bash scripts/package-mac.sh --customer "dist/LIGHT SEEKER.pkg" dist
          else
            echo "::notice title=No customer package::This run was signed ad hoc, so LIGHT SEEKER.pkg is unsigned and the customer artifact $name was not produced. Only the developer artifact LIGHT SEEKER-dev-macOS is available."
          fi
      - name: Upload the customer package (signed runs only, when every check passed)
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.customer.outputs.name }}
          path: dist/${{ steps.customer.outputs.name }}/
          if-no-files-found: error
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WindwardAudio-LightSeeker-macOS-diagnostics
          path: |
            build/ci-logs/
          if-no-files-found: warn
      # Always last: the temporary keychain and the API key file are deleted whatever happened.
      - name: Delete the temporary signing keychain
        if: always()
        run: bash scripts/ci-signing-cleanup.sh
  linux:
    runs-on: ubuntu-24.04
    # The suite, the celesta ring shard and eight listening renders: about 50 minutes on a slow runner.
    timeout-minutes: 90
    env:
      LS_REQUIRE_CAPTURES: ${{ secrets.SAMPLES_TOKEN != '' }}
      LS_REQUIRE_SAMPLES: ${{ secrets.SAMPLES_TOKEN != '' }}
      # The library brass and woodwinds come from a public source: every CI build must have them.
      LS_REQUIRE_LIBRARY: "true"
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_SLOPPINESS: time_macros,include_file_mtime,include_file_ctime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The developer's recordings live in the private AdrianAbbas/Samples repository,
      # read with the SAMPLES_TOKEN secret and prepared for the instrument's sampler here
      # (tools/sample-prep, from WORLDBUILDER). They are never committed to this repository.
      # Without the secret the build goes on and those instruments play their stand-ins.
      # The captured spaces' impulse responses are made from the same repository's effect
      # captures (tools/captures/ci-build-irs.sh) and compiled in; without them, fallbacks.
      - name: Fetch and prepare the recordings (private repository, optional)
        env:
          SAMPLES_TOKEN: ${{ secrets.SAMPLES_TOKEN }}
        run: bash scripts/ci-fetch-samples.sh "${{ runner.temp }}/samples-src" "${{ runner.temp }}/samples" "${{ runner.temp }}/irs"
      # Real brass and woodwinds: the horn, trumpet, trombone and tuba, the flute, oboe, piccolo,
      # clarinet and bassoon of VSCO 2 Community Edition (CC0 1.0,
      # docs/LICENSES/VSCO-2-CE.txt), fetched from its official repository at a pinned commit
      # (licence checked), prepared (tools/sample-prep/vsco.py) and added to the recordings
      # above; never committed here. The prepared notes are cached; without them, stand-ins.
      - name: Library brass and woodwinds cache (VSCO 2 CE, prepared)
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vsco-cache
          key: vsco2ce-28092772-${{ hashFiles('tools/sample-prep/vsco.py', 'tools/sample-prep/prepare.py') }}
      - name: Fetch and prepare the library brass and woodwinds (VSCO 2 CE from its official source)
        run: bash scripts/ci-fetch-vsco.sh "${{ runner.temp }}/vsco-cache" "${{ runner.temp }}/samples"
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libasound2-dev libfreetype6-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libgl1-mesa-dev
      - name: JUCE source cache
        id: juce
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/juce
          key: juce-${{ env.JUCE_COMMIT }}
      - name: Fetch JUCE 8.0.16
        if: steps.juce.outputs.cache-hit != 'true'
        run: bash scripts/ci-fetch-juce.sh "${{ runner.temp }}/juce" "$JUCE_COMMIT"
      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: linux
          max-size: 1G
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DJUCE_PATH="${{ runner.temp }}/juce"
          -DLS_SAMPLES_DIR="${{ runner.temp }}/samples" -DLS_IRS_DIR="${{ runner.temp }}/irs"
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: |
          cmake --build build --parallel 4
          ccache --show-stats
      # The full processor suite as shards in parallel, then the CPU group alone
      # (report-only) so its timings are not disturbed.
      - name: Processor tests (full suite, the effect and the instrument)
        env:
          LIGHTSEEKER_SAMPLES: ${{ runner.temp }}/samples
        run: bash scripts/run-tests-parallel.sh build/LightSeekerTests_artefacts/Release/LightSeekerTests build/test-logs
      # The same guitar and synth phrase dry, then through each place (one A/B file per
      # place), strength.csv, and a journey through every place, in the test-logs artifact.
      - name: Listening renders (dry vs processed per place, WAV)
        if: always()
        run: build/LightSeekerTests_artefacts/Release/LightSeekerTests --listen build/test-logs/listening
      # Every instrument dry and in its own place, a short phrase each (Direction Update 1).
      - name: Instrument listening renders (every instrument dry and in its place, WAV)
        if: always()
        env:
          LIGHTSEEKER_SAMPLES: ${{ runner.temp }}/samples
        run: build/LightSeekerTests_artefacts/Release/LightSeekerTests --listen-instruments build/test-logs/instruments
      # The instruments the recordings update changed: one melody and chord progression each, dry and in its place.
      - name: Changed instruments listening renders (dry and in place, WAV)
        if: always()
        env:
          LIGHTSEEKER_SAMPLES: ${{ runner.temp }}/samples
        run: build/LightSeekerTests_artefacts/Release/LightSeekerTests --listen-changed build/test-logs/changed-instruments
      # Mix and Punch: a four-instrument mini-song with the new mix defaults and with the old
      # mix settings, the brass with Punch 0 then its default; beside them the same song
      # rendered by the code before Mix and Punch and by this one (docs/listening/mix, stand-ins).
      - name: Mix and Punch listening renders (mini-song, brass Punch 0 vs default)
        if: always()
        env:
          LIGHTSEEKER_SAMPLES: ${{ runner.temp }}/samples
        run: |
          build/LightSeekerTests_artefacts/Release/LightSeekerTests --listen-mix build/test-logs/mix
          cp docs/listening/mix/*.ogg build/test-logs/mix/
          build/LightSeekerTests_artefacts/Release/LightSeekerTests --brass-report > build/test-logs/mix/brass-report.txt
      # The real brass (VSCO 2 CE): each brass instrument before (its synthesis) and after (the
      # library), dry and in its place, as separate files and as one A/B file; the mini-song
      # (fanfare brass, strings, choir, harp) before and after; the library's prep report.
      - name: Real brass listening renders (each brass instrument before and after, the mini-song)
        if: always()
        env:
          LIGHTSEEKER_SAMPLES: ${{ runner.temp }}/samples
        run: |
          build/LightSeekerTests_artefacts/Release/LightSeekerTests --listen-brass build/test-logs/real-brass
          cp "${{ runner.temp }}/samples/report-vsco.json" build/test-logs/real-brass/ || true
          build/LightSeekerTests_artefacts/Release/LightSeekerTests --brass-report > build/test-logs/real-brass/brass-report.txt
      # The loudness rebalance: a short mix (harp arpeggios, strings pad, brass, choir, flute), every
      # instrument at its defaults and no fader moved, with the trims before and after; the table of
      # every instrument's loudness on the test set (BS.1770), now and before.
      - name: Loudness listening renders (a short mix before and after the rebalance, the loudness tables)
        if: always()
        env:
          LIGHTSEEKER_SAMPLES: ${{ runner.temp }}/samples
        run: |
          build/LightSeekerTests_artefacts/Release/LightSeekerTests --listen-loudness build/test-logs/loudness
          build/LightSeekerTests_artefacts/Release/LightSeekerTests --loudness-report > build/test-logs/loudness/loudness-table.txt
          build/LightSeekerTests_artefacts/Release/LightSeekerTests --loudness-report before > build/test-logs/loudness/loudness-table-before.txt
      # The real woodwinds (VSCO 2 CE): each changed instrument before (its synthesis) and after (the
      # library), dry and in its place, as separate files and as one A/B file; the cents report.
      - name: Real woodwinds listening renders (each woodwind instrument before and after)
        if: always()
        env:
          LIGHTSEEKER_SAMPLES: ${{ runner.temp }}/samples
        run: |
          build/LightSeekerTests_artefacts/Release/LightSeekerTests --listen-woodwinds build/test-logs/real-woodwinds > build/test-logs/woodwinds-report.txt
          mv build/test-logs/woodwinds-report.txt build/test-logs/real-woodwinds/
          cp "${{ runner.temp }}/samples/report-vsco.json" build/test-logs/real-woodwinds/ || true
      # The celesta's softer ring: the celesta before and after, alone (dry and in the Diamond Vault)
      # and in the seven-part test piece; the afterring and inharmonic-tail report.
      - name: Celesta ring listening renders (the celesta before and after, alone and in the seven-part piece)
        if: always()
        env:
          LIGHTSEEKER_SAMPLES: ${{ runner.temp }}/samples
        run: |
          build/LightSeekerTests_artefacts/Release/LightSeekerTests --listen-ring build/test-logs/celesta-ring > build/test-logs/celesta-ring.txt
          build/LightSeekerTests_artefacts/Release/LightSeekerTests --ring-report >> build/test-logs/celesta-ring.txt
          mv build/test-logs/celesta-ring.txt build/test-logs/celesta-ring/
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WindwardAudio-LightSeeker-linux-test-logs
          path: build/test-logs/
          if-no-files-found: warn
  release:
    # Tagged commits (v*) publish the customer package as a GitHub Release: LIGHT SEEKER-<version>-macOS.zip
    # with only "LIGHT SEEKER Installer.pkg" and "LIGHT SEEKER - Read Me.pdf". It needs a signed run on the tag (docs/RELEASING.md).
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ${{ needs.macos.outputs.customer }}
          path: ${{ needs.macos.outputs.customer }}
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          CUSTOMER: ${{ needs.macos.outputs.customer }}
        run: |
          if [[ ! -f "$CUSTOMER/LIGHT SEEKER Installer.pkg" ]]; then
            echo "::error::no signed LIGHT SEEKER Installer.pkg in this run (ad-hoc build), so there is no customer package to release"
            exit 1
          fi
          (cd "$CUSTOMER" && zip -X "../$CUSTOMER.zip" "LIGHT SEEKER Installer.pkg" "LIGHT SEEKER - Read Me.pdf")
          gh release create "$GITHUB_REF_NAME" "$CUSTOMER.zip" --repo "$GITHUB_REPOSITORY" --title "LIGHT SEEKER $GITHUB_REF_NAME" --generate-notes
