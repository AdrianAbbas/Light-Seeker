name: Native build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  JUCE_COMMIT: ea77444750de45e036e0279bb0291144bf8e3688 # JUCE 8.0.16, as in CMakeLists.txt
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      # The optional Developer ID path runs only when these secrets exist.
      HAS_DEVELOPER_ID: ${{ secrets.MACOS_CERTIFICATE != '' }}
      # With the Samples token the captured spaces and the recordings must be there (the
      # smoke test checks); without it the build falls back to the stand-ins.
      LS_REQUIRE_CAPTURES: ${{ secrets.SAMPLES_TOKEN != '' }}
      LS_REQUIRE_SAMPLES: ${{ secrets.SAMPLES_TOKEN != '' }}
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_SLOPPINESS: time_macros,include_file_mtime,include_file_ctime
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain and Rosetta
        run: |
          sw_vers
          xcodebuild -version
          cmake --version
          /usr/sbin/softwareupdate --install-rosetta --agree-to-license || true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The developer's recordings live in the private AdrianAbbas/Samples repository,
      # read with the SAMPLES_TOKEN secret and prepared for the instrument's sampler here
      # (tools/sample-prep, from WORLDBUILDER). They are never committed to this repository.
      # Without the secret the build goes on and those instruments play their stand-ins.
      # The captured spaces' impulse responses are made from the same repository's effect
      # captures (tools/captures/ci-build-irs.sh) and compiled in; without them, fallbacks.
      - name: Fetch and prepare the recordings (private repository, optional)
        env:
          SAMPLES_TOKEN: ${{ secrets.SAMPLES_TOKEN }}
        run: bash scripts/ci-fetch-samples.sh "${{ runner.temp }}/samples-src" "${{ runner.temp }}/samples" "${{ runner.temp }}/irs"
      # JUCE is fetched once and kept (the configure step otherwise clones its whole history).
      - name: JUCE source cache
        id: juce
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/juce
          key: juce-${{ env.JUCE_COMMIT }}
      - name: Fetch JUCE 8.0.16
        if: steps.juce.outputs.cache-hit != 'true'
        run: bash scripts/ci-fetch-juce.sh "${{ runner.temp }}/juce" "$JUCE_COMMIT"
      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: macos-universal
          max-size: 2G
      - name: Configure (universal arm64 + x86_64, macOS 10.15+)
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15
          -DJUCE_PATH="${{ runner.temp }}/juce" -DLS_SAMPLES_DIR="${{ runner.temp }}/samples" -DLS_IRS_DIR="${{ runner.temp }}/irs"
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build (LIGHT SEEKER and LIGHT SEEKER FX)
        run: |
          cmake --build build --parallel 4
          ccache --show-stats
      # The full processor suite runs in the Linux job. Here a short smoke group checks
      # each slice of the universal binary, and the cpu group reports (never fails on)
      # the cost of every location on this runner.
      - name: Smoke test, instrument checks and CPU report (arm64)
        env:
          LIGHTSEEKER_SAMPLES: ${{ runner.temp }}/samples
        run: /usr/bin/arch -arm64 build/LightSeekerTests_artefacts/Release/LightSeekerTests --only smoke,instrument,cpu
      - name: Smoke test, instrument checks and CPU report (x86_64 under Rosetta)
        env:
          LIGHTSEEKER_SAMPLES: ${{ runner.temp }}/samples
        run: /usr/bin/arch -x86_64 build/LightSeekerTests_artefacts/Release/LightSeekerTests --only smoke,instrument,cpu
      - name: Universal binary and Info.plist gate (both plug-ins)
        run: bash scripts/ci-check-bundles.sh build
      - name: Developer ID signing and notarisation (optional, untested)
        if: env.HAS_DEVELOPER_ID == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: bash scripts/ci-developer-id.sh build
      - name: Sign, verify and package (both plug-ins)
        run: bash scripts/package-mac.sh build dist
      - name: Build AU host harness
        run: bash scripts/build-au-harness.sh build/LightSeekerAUHarness
      - name: Install a quarantined download with install-mac.sh, then auval and harness for both plug-ins (arm64 + x86_64)
        run: bash scripts/ci-user-install-test.sh dist/LightSeeker-macOS-Universal.zip build/LightSeekerAUHarness build/ci-logs
      # Annotations are readable through the REST API; GitHub keeps at most 10 per step.
      - name: Publish install and arm64 harness logs as annotations
        if: always()
        run: bash scripts/ci-annotate.sh --condense build/ci-logs/quarantine.txt build/ci-logs/install-mac.txt build/ci-logs/harness-arm64-*.txt
      - name: Publish x86_64 harness and auval logs as annotations
        if: always()
        run: |
          for f in build/ci-logs/auval-*.txt; do
            if [[ -f "$f" ]]; then tail -25 "$f" > "$f.tail"; fi
          done
          bash scripts/ci-annotate.sh --condense build/ci-logs/harness-x86_64-*.txt build/ci-logs/control-*.txt build/ci-logs/crashes.txt build/ci-logs/auval-*.txt.tail
      - name: Upload installable package (only when every check passed)
        uses: actions/upload-artifact@v4
        with:
          name: LightSeeker-macOS-Universal
          path: dist/LightSeeker-macOS-Universal.zip
          if-no-files-found: error
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LightSeeker-macOS-diagnostics
          path: |
            build/ci-logs/
          if-no-files-found: warn
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      LS_REQUIRE_CAPTURES: ${{ secrets.SAMPLES_TOKEN != '' }}
      LS_REQUIRE_SAMPLES: ${{ secrets.SAMPLES_TOKEN != '' }}
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_SLOPPINESS: time_macros,include_file_mtime,include_file_ctime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The developer's recordings live in the private AdrianAbbas/Samples repository,
      # read with the SAMPLES_TOKEN secret and prepared for the instrument's sampler here
      # (tools/sample-prep, from WORLDBUILDER). They are never committed to this repository.
      # Without the secret the build goes on and those instruments play their stand-ins.
      # The captured spaces' impulse responses are made from the same repository's effect
      # captures (tools/captures/ci-build-irs.sh) and compiled in; without them, fallbacks.
      - name: Fetch and prepare the recordings (private repository, optional)
        env:
          SAMPLES_TOKEN: ${{ secrets.SAMPLES_TOKEN }}
        run: bash scripts/ci-fetch-samples.sh "${{ runner.temp }}/samples-src" "${{ runner.temp }}/samples" "${{ runner.temp }}/irs"
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libasound2-dev libfreetype6-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libgl1-mesa-dev
      - name: JUCE source cache
        id: juce
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/juce
          key: juce-${{ env.JUCE_COMMIT }}
      - name: Fetch JUCE 8.0.16
        if: steps.juce.outputs.cache-hit != 'true'
        run: bash scripts/ci-fetch-juce.sh "${{ runner.temp }}/juce" "$JUCE_COMMIT"
      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: linux
          max-size: 1G
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DJUCE_PATH="${{ runner.temp }}/juce"
          -DLS_SAMPLES_DIR="${{ runner.temp }}/samples" -DLS_IRS_DIR="${{ runner.temp }}/irs"
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: |
          cmake --build build --parallel 4
          ccache --show-stats
      # The full processor suite as shards in parallel, then the CPU group alone
      # (report-only) so its timings are not disturbed.
      - name: Processor tests (full suite, the effect and the instrument)
        env:
          LIGHTSEEKER_SAMPLES: ${{ runner.temp }}/samples
        run: bash scripts/run-tests-parallel.sh build/LightSeekerTests_artefacts/Release/LightSeekerTests build/test-logs
      # The same guitar and synth phrase dry, then through each place (one A/B file per
      # place), strength.csv, and a journey through every place, in the test-logs artifact.
      - name: Listening renders (dry vs processed per place, WAV)
        if: always()
        run: build/LightSeekerTests_artefacts/Release/LightSeekerTests --listen build/test-logs/listening
      # Every instrument dry and in its own place, a short phrase each (Direction Update 1).
      - name: Instrument listening renders (every instrument dry and in its place, WAV)
        if: always()
        env:
          LIGHTSEEKER_SAMPLES: ${{ runner.temp }}/samples
        run: build/LightSeekerTests_artefacts/Release/LightSeekerTests --listen-instruments build/test-logs/instruments
      # The instruments the recordings update changed: one melody and chord progression each, dry and in its place.
      - name: Changed instruments listening renders (dry and in place, WAV)
        if: always()
        env:
          LIGHTSEEKER_SAMPLES: ${{ runner.temp }}/samples
        run: build/LightSeekerTests_artefacts/Release/LightSeekerTests --listen-changed build/test-logs/changed-instruments
      # Mix and Punch: a four-instrument mini-song with the new mix defaults and with the old
      # mix settings, the brass with Punch 0 then its default; beside them the same song
      # rendered by the code before Mix and Punch and by this one (docs/listening/mix, stand-ins).
      - name: Mix and Punch listening renders (mini-song, brass Punch 0 vs default)
        if: always()
        env:
          LIGHTSEEKER_SAMPLES: ${{ runner.temp }}/samples
        run: |
          build/LightSeekerTests_artefacts/Release/LightSeekerTests --listen-mix build/test-logs/mix
          cp docs/listening/mix/*.ogg build/test-logs/mix/
          build/LightSeekerTests_artefacts/Release/LightSeekerTests --brass-report > build/test-logs/mix/brass-report.txt
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LightSeeker-linux-test-logs
          path: build/test-logs/
          if-no-files-found: warn
  release:
    # Tagged commits (v*) publish the same package as a GitHub Release.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: LightSeeker-macOS-Universal
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" LightSeeker-macOS-Universal.zip --repo "$GITHUB_REPOSITORY" --title "LIGHT SEEKER $GITHUB_REF_NAME" --generate-notes
