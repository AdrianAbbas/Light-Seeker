name: Native build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  JUCE_COMMIT: ea77444750de45e036e0279bb0291144bf8e3688 # JUCE 8.0.16, as in CMakeLists.txt
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      # The optional Developer ID path runs only when these secrets exist.
      HAS_DEVELOPER_ID: ${{ secrets.MACOS_CERTIFICATE != '' }}
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_SLOPPINESS: time_macros,include_file_mtime,include_file_ctime
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain and Rosetta
        run: |
          sw_vers
          xcodebuild -version
          cmake --version
          /usr/sbin/softwareupdate --install-rosetta --agree-to-license || true
      # JUCE is fetched once and kept (the configure step otherwise clones its whole history).
      - name: JUCE source cache
        id: juce
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/juce
          key: juce-${{ env.JUCE_COMMIT }}
      - name: Fetch JUCE 8.0.16
        if: steps.juce.outputs.cache-hit != 'true'
        run: bash scripts/ci-fetch-juce.sh "${{ runner.temp }}/juce" "$JUCE_COMMIT"
      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: macos-universal
          max-size: 2G
      - name: Configure (universal arm64 + x86_64, macOS 10.15+)
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15
          -DJUCE_PATH="${{ runner.temp }}/juce"
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: |
          cmake --build build --parallel 4
          ccache --show-stats
      # The full processor suite runs in the Linux job. Here a short smoke group checks
      # each slice of the universal binary, and the cpu group reports (never fails on)
      # the cost of every location on this runner.
      - name: Smoke test and CPU report (arm64)
        run: /usr/bin/arch -arm64 build/LightSeekerTests_artefacts/Release/LightSeekerTests --only smoke,cpu
      - name: Smoke test and CPU report (x86_64 under Rosetta)
        run: /usr/bin/arch -x86_64 build/LightSeekerTests_artefacts/Release/LightSeekerTests --only smoke,cpu
      - name: Universal binary and Info.plist gate
        run: bash scripts/ci-check-bundles.sh build/LightSeeker_artefacts/Release
      - name: Developer ID signing and notarisation (optional, untested)
        if: env.HAS_DEVELOPER_ID == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: bash scripts/ci-developer-id.sh build/LightSeeker_artefacts/Release
      - name: Sign, verify and package
        run: bash scripts/package-mac.sh build/LightSeeker_artefacts/Release dist
      - name: Build AU host harness
        run: bash scripts/build-au-harness.sh build/LightSeekerAUHarness
      - name: Install a quarantined download with install-mac.sh, then auval and harness (arm64 + x86_64)
        run: bash scripts/ci-user-install-test.sh dist/LightSeeker-macOS-Universal.zip build/LightSeekerAUHarness build/ci-logs
      # Annotations are readable through the REST API; GitHub keeps at most 10 per step.
      - name: Publish install and arm64 harness logs as annotations
        if: always()
        run: bash scripts/ci-annotate.sh --condense build/ci-logs/quarantine.txt build/ci-logs/install-mac.txt build/ci-logs/harness-arm64-*.txt
      - name: Publish x86_64 harness and auval logs as annotations
        if: always()
        run: |
          for f in build/ci-logs/auval-*.txt; do
            if [[ -f "$f" ]]; then tail -25 "$f" > "$f.tail"; fi
          done
          bash scripts/ci-annotate.sh --condense build/ci-logs/harness-x86_64-*.txt build/ci-logs/control-*.txt build/ci-logs/crashes.txt build/ci-logs/auval-*.txt.tail
      - name: Upload installable package (only when every check passed)
        uses: actions/upload-artifact@v4
        with:
          name: LightSeeker-macOS-Universal
          path: dist/LightSeeker-macOS-Universal.zip
          if-no-files-found: error
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LightSeeker-macOS-diagnostics
          path: |
            build/ci-logs/
          if-no-files-found: warn
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_SLOPPINESS: time_macros,include_file_mtime,include_file_ctime
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libasound2-dev libfreetype6-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libgl1-mesa-dev
      - name: JUCE source cache
        id: juce
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/juce
          key: juce-${{ env.JUCE_COMMIT }}
      - name: Fetch JUCE 8.0.16
        if: steps.juce.outputs.cache-hit != 'true'
        run: bash scripts/ci-fetch-juce.sh "${{ runner.temp }}/juce" "$JUCE_COMMIT"
      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: linux
          max-size: 1G
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DJUCE_PATH="${{ runner.temp }}/juce"
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: |
          cmake --build build --parallel 4
          ccache --show-stats
      # The full processor suite as shards in parallel, then the CPU group alone
      # (report-only) so its timings are not disturbed.
      - name: Processor tests (full suite)
        run: bash scripts/run-tests-parallel.sh build/LightSeekerTests_artefacts/Release/LightSeekerTests build/test-logs
      # The same guitar and synth phrase dry, then through each place (one A/B file per
      # place), strength.csv, and a journey through every place, in the test-logs artifact.
      - name: Listening renders (dry vs processed per place, WAV)
        if: always()
        run: build/LightSeekerTests_artefacts/Release/LightSeekerTests --listen build/test-logs/listening
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LightSeeker-linux-test-logs
          path: build/test-logs/
          if-no-files-found: warn
  release:
    # Tagged commits (v*) publish the same package as a GitHub Release.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: LightSeeker-macOS-Universal
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" LightSeeker-macOS-Universal.zip --repo "$GITHUB_REPOSITORY" --title "LIGHT SEEKER $GITHUB_REF_NAME" --generate-notes
